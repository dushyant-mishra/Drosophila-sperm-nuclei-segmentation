project_root: /content/unet25d_workspace/data
stack_image_dir: /content/unet25d_workspace/data/images

annotation_manifest: /content/unet25d_workspace/data/annotated-2/manifest.json
valid_z_indices: [1, 37]

output_dir: /content/unet25d_workspace/repo/unet25d/outputs_resatt_partial_annotated2
checkpoint_mirror_dir: /content/drive/MyDrive/unet25d_output/checkpoints_resatt_partial_annotated2

z_regex: 'Project001_Series002_z(\d+)_ch00'
image_pattern: 'Project001_Series002_z{z:02d}_ch00.tif'

architecture: residual_attention_unet
partial_labels: true
ignore_unlabeled_intensity_percentile: 97.0
ignore_labeled_dilate_px: 4
ignore_candidate_dilate_px: 1
positive_patch_probability: 0.90
train_mask_dilate_px: 1
positive_loss_weight: 1.5

patch_size: 256
patches_per_image: 96
epochs: 40
batch_size: 8
base_channels: 24
learning_rate: 0.0003
weight_decay: 0.00001
seed: 791
threshold: 0.5

roi_mask_path: ""
unet_inference_mode: roi_tiled
unet_tile_size: 256
unet_tile_overlap: 64
unet_roi_padding_px: 32
unet_outside_roi_zero: true
unet_candidate_threshold: 0.05
unet_seed_threshold: 0.30

infer_z_indices: [5, 6, 12, 35, 60, 87]
